let st=Object.assign({done:{},scores:{},vocab:{},last:null,goal:"2027-06-01",rec:{}},S());
const save=()=>{try{localStorage.setItem("ej",JSON.stringify(st))}catch(e){}};
let tab="home",cur=null,rate=0.8,hide=false,qs=null,rec=null,q="";
const $=document.getElementById.bind(document);
const pct=(ids)=>ids.length?Math.round(ids.filter(i=>st.done[i]).length/ids.length*100):0;
const bar=p=>`<div class="bar"><i style="width:${p}%"></i></div>`;
function say(t){if(!("speechSynthesis" in window)){alert("เบราว์เซอร์นี้ไม่รองรับเสียงอ่าน ลองใช้ Safari หรือ Chrome รุ่นใหม่");return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="en-US";u.rate=rate;speechSynthesis.speak(u)}
function go(t,l){tab=t;cur=l||null;qs=null;render();scrollTo(0,0)}
function nav(){const T=[["home","หน้าหลัก"],["course","หลักสูตร"],["vocab","คำศัพท์"],["crew","แอร์"],["more","ความก้าวหน้า"]];$("nav").innerHTML=T.map(([k,n])=>`<button class="${tab==k||(tab=="lesson"&&k=="course")?"on":""}" onclick="go('${k}')">${n}</button>`).join("")}
function render(){nav();$("app").innerHTML=({home,course,lesson,vocab,crew,more})[tab]()}
function home(){const ids=L.map(l=>l.id),nx=L.find(l=>!st.done[l.id])||L[0],last=L.find(l=>l.id==st.last);
const days=Math.max(0,Math.ceil((new Date(st.goal)-new Date())/864e5));
return `<h1>English Journey</h1><div class="mu">Beginner to Cabin Crew · ต.ค. 2569 – 31 พ.ค. 2570</div>
<div class="c"><h2>ความก้าวหน้าบทที่มีในเว็บ</h2>${bar(pct(ids))}<div class="mu">${pct(ids)}% (${ids.filter(i=>st.done[i]).length}/${ids.length} บท)</div>
<button class="b" onclick="go('lesson','${(last&&!st.done[last.id]?last:nx).id}')">เรียนต่อ: ${(last&&!st.done[last.id]?last:nx).t}</button></div>
<div class="c"><h2>ตารางเรียน 2 ชั่วโมง</h2><table><tr><td>20 น.</td><td>คำศัพท์และการออกเสียง</td></tr><tr><td>25 น.</td><td>ไวยากรณ์</td></tr><tr><td>25 น.</td><td>ฟังและพูดตาม</td></tr><tr><td>30 น.</td><td>ฝึกพูดและสนทนา</td></tr><tr><td>15 น.</td><td>ภาษาอังกฤษสำหรับแอร์</td></tr><tr><td>5 น.</td><td>ทบทวน</td></tr></table><div class="mu">แนะนำ: วันที่ 7 ของทุกสัปดาห์เป็นวันทบทวนและแบบทดสอบ ไม่เรียนเนื้อหาใหม่</div></div>
<div class="c"><h2>เป้าหมายก่อนเปิดเทอม มรร.</h2><div class="mu">ภาษาจีน ภาคเรียนที่ 1 ปีการศึกษา 2570 (ตั้งวันที่เปิดเทอมเองได้)</div><input type="date" value="${st.goal}" onchange="st.goal=this.value;save();render()"><p>เหลืออีก <b>${days}</b> วัน</p></div>`}
function course(){return `<h1>หลักสูตร 8 เดือน</h1><input type="search" placeholder="ค้นหาบทเรียน" value="${q}" oninput="q=this.value;course2()"><div id="cl">${cl()}</div>`}
function course2(){$("cl").innerHTML=cl()}
function cl(){return MONTHS.map((m,i)=>{const ls=L.filter(l=>l.m==i&&(l.t+l.id).toLowerCase().includes(q.toLowerCase()));if(q&&!ls.length)return"";
return `<div class="c"><h2>${m[0]}</h2><div class="mu">${m[1]}</div>${bar(pct(L.filter(l=>l.m==i).map(l=>l.id)))}${ls.map(l=>`<button class="o" onclick="go('lesson','${l.id}')">${st.done[l.id]?"✅":"▶️"} ${l.t}</button>`).join("")||'<p class="mu">บทเรียนเดือนนี้ยังไม่ได้สร้างในเวอร์ชันนี้ (ดูโครงหัวข้อด้านบน)</p>'}</div>`}).join("")}
function lesson(){const l=L.find(x=>x.id==cur);st.last=l.id;save();
const sp=t=>`<button class="b g" onclick="say(this.dataset.t)" data-t="${t.replace(/"/g,"&quot;")}">🔊</button>`;
return `<button class="b g" onclick="go('course')">← กลับ</button><h1>${l.t}</h1><div class="mu">เป้าหมาย: ${l.goal}</div>
<div class="c">${l.th}</div>
<div class="c"><h3>ฟังและตั้งค่า</h3>ความเร็วเสียง: <select onchange="rate=+this.value"><option value="0.6">ช้ามาก</option><option value="0.8" selected>ช้า</option><option value="1">ปกติ</option></select>
<button class="b g" onclick="hide=!hide;render()">${hide?"แสดง":"ซ่อน"}คำแปล</button></div>
<div class="c"><h3>คำศัพท์</h3><table>${l.v.map(([e,t,r])=>`<tr><td>${sp(e)}</td><td><b>${e}</b><br><span class="mu">อ่านว่า ${r}</span></td><td>${hide?"•••":t}<br><button class="tag" onclick="mark('${e}',1)">${st.vocab[e]==1?"✓ จำได้":"จำได้"}</button> <button class="tag" onclick="mark('${e}',0)">${st.vocab[e]==0?"✓ ยังไม่แม่น":"ยังไม่แม่น"}</button></td></tr>`).join("")}</table>
<p class="mu">💡 ${l.sound}<br>คำอ่านไทยช่วยได้เพียงเริ่มต้น กรุณาฟังเสียงจริงทุกครั้ง</p></div>
<div class="c"><h3>ไวยากรณ์</h3><div style="white-space:pre-line">${l.g}</div></div>
<div class="c"><h3>ตัวอย่างประโยค</h3>${l.s.map(([e,t])=>`<p>${sp(e)} ${e}<br><span class="mu">${hide?"•••":t}</span></p>`).join("")}</div>
<div class="c"><h3>บทสนทนา</h3>${l.d.map(([w,t])=>`<p><b>${w}:</b> ${t} ${sp(t)}</p>`).join("")}</div>
<div class="c"><h3>ฝึกพูดตามและอัดเสียง</h3><button class="b" onclick="recStart()">⏺ อัด</button><button class="b g" onclick="recStop()">⏹ หยุด</button><div id="ra"></div>
<p class="mu">เว็บนี้ไม่ได้ตรวจสำเนียงให้ ใช้ฟังเทียบเสียงตัวเองกับเสียงตัวอย่างด้วยตัวเอง (ต้องอนุญาตไมค์ และบางเบราว์เซอร์ไม่รองรับ)</p></div>
<div class="c"><h3>ภารกิจ</h3>${l.task}</div>
<div class="c"><h3>แบบฝึกหัด 5 ข้อ</h3><div id="qz">${quiz(l)}</div></div>
<button class="b ${st.done[l.id]?"":"ok"}" onclick="st.done['${l.id}']=!st.done['${l.id}'];save();render()">${st.done[l.id]?"✅ เรียนจบแล้ว (กดเพื่อยกเลิก)":"ทำเครื่องหมายว่าเรียนจบแล้ว"}</button>`}
function quiz(l){qs=qs||{i:0,s:0,p:null};if(qs.i>=l.q.length){st.scores[l.id]=Math.round(qs.s/l.q.length*100);save();return `<p><b>คะแนน ${qs.s}/${l.q.length}</b></p><button class="b" onclick="qs=null;render()">ทำใหม่</button>`}
const [q1,o,a,w]=l.q[qs.i];return `<p class="mu">ข้อ ${qs.i+1}/${l.q.length}</p><p><b>${q1}</b></p>${o.map((x,k)=>`<button class="o ${qs.p!=null?(k==a?"r":k==qs.p?"w":""):""}" ${qs.p!=null?"disabled":""} onclick="ans(${k})">${x}</button>`).join("")}${qs.p!=null?`<p>${qs.p==a?"✓ ถูก":"✗ ผิด"} — ${w}</p><button class="b" onclick="qs.i++;qs.p=null;render()">ต่อไป</button>`:""}`}
function ans(k){const l=L.find(x=>x.id==cur);qs.p=k;if(k==l.q[qs.i][2])qs.s++;render()}
function mark(w,v){st.vocab[w]=v;save();render()}
async function recStart(){try{const s=await navigator.mediaDevices.getUserMedia({audio:true});const ch=[];rec=new MediaRecorder(s);rec.ondataavailable=e=>ch.push(e.data);rec.onstop=()=>{s.getTracks().forEach(t=>t.stop());$("ra").innerHTML=`<audio controls src="${URL.createObjectURL(new Blob(ch,{type:rec.mimeType}))}"></audio>`};rec.start()}catch(e){alert("อัดเสียงไม่ได้บนเบราว์เซอร์นี้ ให้ใช้แอป Voice Memos ของ iPhone แทน")}}
function recStop(){if(rec&&rec.state!="inactive")rec.stop()}
function vocab(){const all=L.flatMap(l=>l.v);return `<h1>คลังคำศัพท์</h1><input type="search" placeholder="ค้นหา" oninput="vs(this.value)"><div id="vl">${vl(all,"")}</div>`}
function vs(v){$("vl").innerHTML=vl(L.flatMap(l=>l.v),v)}
function vl(a,f){f=f.toLowerCase();return `<div class="c"><table>${a.filter(x=>(x[0]+x[1]).toLowerCase().includes(f)).map(([e,t,r])=>`<tr><td><button class="b g" onclick="say('${e}')">🔊</button></td><td><b>${e}</b> <span class="mu">${r}</span><br>${t}</td><td>${st.vocab[e]==1?"✅":st.vocab[e]==0?"⚠️":""}</td></tr>`).join("")}</table></div>`}
function crew(){return `<h1>เตรียมสมัคร Cabin Crew</h1><div class="c"><b>คุณสมบัติสายการบิน</b><p class="mu">ไม่ได้ใส่เกณฑ์ไว้ในเว็บนี้เพราะเปลี่ยนบ่อย ตรวจสอบจากหน้า careers ทางการของสายการบินเสมอ แล้วจดวันที่ตรวจสอบ:</p><textarea rows="3" placeholder="เช่น Emirates: ตรวจเมื่อ __/__/____ ..." oninput="st.notes=this.value;save()">${st.notes||""}</textarea></div>
${CC.map(([qq,h,ex],i)=>`<div class="c"><h3>${qq} ${"<button class='b g' onclick=\"say(this.dataset.t)\" data-t='"+qq+"'>🔊</button>"}</h3><p class="mu">ลองตอบก่อนเปิดดู: ${h}</p><details><summary>ดูตัวอย่างโครงคำตอบ</summary><p>${ex}</p><p class="mu">⚠️ ตัวอย่างนี้เป็นโครงเท่านั้น เปลี่ยนเป็นเรื่องจริงของคุณและพูดด้วยคำของตัวเอง อย่าท่องทั้งหมดและอย่าเพิ่มประสบการณ์ที่ไม่มีจริง</p></details></div>`).join("")}`}
function more(){const ids=L.map(l=>l.id),sc=Object.entries(st.scores),v=Object.values(st.vocab);
return `<h1>ความก้าวหน้า</h1><div class="c"><h2>สรุป</h2>เรียนจบ ${ids.filter(i=>st.done[i]).length}/${ids.length} บท<br>คำศัพท์จำได้ ${v.filter(x=>x==1).length} · ต้องทบทวน ${v.filter(x=>x==0).length}<h3>คะแนนแบบฝึกหัด</h3>${sc.map(([k,s])=>`${L.find(l=>l.id==k).t}: ${s}%`).join("<br>")||"<span class=mu>ยังไม่มี</span>"}</div>
<div class="c"><h2>สำรอง/กู้คืน</h2><button class="b" onclick="exp()">Export JSON</button><input type="file" accept=".json" onchange="imp(this.files[0])">
<p class="mu">ข้อมูลเก็บในเบราว์เซอร์ของเครื่องนี้ (localStorage) เท่านั้น <b>ไม่ซิงก์ข้ามอุปกรณ์</b> และจะหายถ้าล้างข้อมูลเว็บ ควร Export เป็นประจำ</p></div>`}
function exp(){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(st)],{type:"application/json"}));a.download="english-journey-progress.json";a.click()}
function imp(f){if(!f)return;f.text().then(t=>{try{st=Object.assign(st,JSON.parse(t));save();render();alert("นำเข้าสำเร็จ")}catch(e){alert("ไฟล์ไม่ถูกต้อง")}})}
render();
</script></body></html>
